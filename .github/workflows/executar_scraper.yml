name: Executar Scraping e Processamento Real

on:
  schedule:
    # Scraper mensal
    - cron: '0 16 13 * *'

    # Mantém o Supabase ativo
    - cron: '0 12 * * 1,3,5'

  workflow_dispatch:

jobs:

  # ==========================================
  # MANTER SUPABASE ATIVO
  # ==========================================
  manter-supabase-ativo:
    runs-on: ubuntu-latest

    steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar psycopg2
      run: |
        pip install psycopg2-binary

    - name: Fazer consulta no banco
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python - <<'PY'
        import os
        import psycopg2

        conn = psycopg2.connect(os.environ["DATABASE_URL"])

        with conn.cursor() as cursor:
            cursor.execute("SELECT 1")
            print("Supabase está ativo:", cursor.fetchone())

        conn.close()
        PY

  # ==========================================
  # SCRAPER E PROCESSAMENTO
  # ==========================================
  scrapar-e-processar:
    if: github.event.schedule == '0 16 13 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requeriments.txt

    - name: Executar Scraper
      env:
        SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python main.py

    - name: Executar Processamento de Dados
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python processar_dados.py <<< ""

    - name: Commitar dados diretamente no repositório
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

        git add data/processed/*.json

        git diff-index --quiet HEAD || git commit -m "bot: atualizando dados extraídos da OLX [skip ci]"

        git push
