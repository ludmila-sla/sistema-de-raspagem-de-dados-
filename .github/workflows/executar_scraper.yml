name: Executar Scraping e Processamento Real

on:
  schedule:
    # Scraper mensal - dia 20 às 16:00 UTC
    - cron: '0 16 20 * *'

    # Mantém o Supabase ativo - diariamente às 12:00 UTC
    - cron: '0 12 * * *'

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:

 # ==========================================
  # MANTER SUPABASE ATIVO
  # ==========================================
  manter-supabase-ativo:
    if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Fazer query direta no PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Realizando ping direto no banco de dados Supabase..."
          psql "$DATABASE_URL" -c "SELECT version();"
          echo "Supabase mantido ativo com sucesso."

  # ==========================================
  # SCRAPER E PROCESSAMENTO
  # ==========================================
  scrapar-e-processar:
    if: github.event.schedule == '0 16 20 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requeriments.txt

      - name: Executar Scraper
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py

      - name: Executar Processamento de Dados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python processar_dados.py <<< ""

      - name: Commitar dados diretamente no repositório
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add data/processed/*.json

          git diff-index --quiet HEAD || git commit -m "bot: atualizando dados extraídos da OLX [skip ci]"

          git push
