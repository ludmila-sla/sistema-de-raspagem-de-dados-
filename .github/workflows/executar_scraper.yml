name: Executar Scraping e Processamento Real

on:
  schedule:
    # Scraper mensal - dia 20 às 16:00 UTC
    - cron: '0 16 20 * *'

    # Mantém o Supabase ativo - diariamente às 12:00 UTC
    - cron: '0 12 * * *'

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:

  # ==========================================
  # MANTER SUPABASE ATIVO
  # ==========================================
  manter-supabase-ativo:
    if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Fazer consulta via API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "Verificando Supabase..."

          curl --fail --show-error \
            "$SUPABASE_URL/rest/v1/anuncios?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"

          echo ""
          echo "Supabase acessado com sucesso."
